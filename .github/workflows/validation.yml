name: validation

# Pull requests run every test on the declared minimum Python 3.10 in five
# shards (whole modules; the two nested-run modules split by class/method,
# see docs/validation/BUNDLE.md). Python 3.14 keeps the required check name with a fast
# import/compile/smoke lane; main pushes and manual runs use full shards on both.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  suite-shards-py310:
    name: validation shard (py3.10, ${{ matrix.shard }}/5)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Preserve published bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Bundle integrity
        run: python tools/check_bundle.py --root . --json "$RUNNER_TEMP/check-bundle-report.json"
      - name: Manifest is current and deterministic
        run: |
          python tools/build_validation_bundle.py --root . --check
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-a" --receipt "$RUNNER_TEMP/receipt-a.json"
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-b" --receipt "$RUNNER_TEMP/receipt-b.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          a = json.loads((tmp / 'receipt-a.json').read_text())
          b = json.loads((tmp / 'receipt-b.json').read_text())
          assert a['tree_sha256'] == b['tree_sha256'], 'export not deterministic'
          PY
      - name: Validation shard
        run: python tools/run_validation.py --shard "${{ matrix.shard }}/5" --json "$RUNNER_TEMP/shard-report.json"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-shard-py3.10-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/check-bundle-report.json
            ${{ runner.temp }}/shard-report.json
          if-no-files-found: error

  validate-py310:
    name: suite (ubuntu, py3.10)
    if: ${{ always() }}
    needs: [suite-shards-py310]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve published bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Require every py3.10 shard
        env:
          SHARDS_RESULT: ${{ needs.suite-shards-py310.result }}
        run: test "$SHARDS_RESULT" = success
      - name: Download shard reports
        uses: actions/download-artifact@v4
        with:
          pattern: validation-shard-py3.10-*
          merge-multiple: false
          path: ${{ runner.temp }}/shards
      - name: Install full-suite dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Bundle integrity
        run: python tools/check_bundle.py --root . --json "$RUNNER_TEMP/check-bundle-report.json"
      - name: Manifest is current and deterministic
        run: |
          python tools/build_validation_bundle.py --root . --check
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-a" --receipt "$RUNNER_TEMP/receipt-a.json"
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-b" --receipt "$RUNNER_TEMP/receipt-b.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          a = json.loads((tmp / 'receipt-a.json').read_text())
          b = json.loads((tmp / 'receipt-b.json').read_text())
          assert a['tree_sha256'] == b['tree_sha256'], 'export not deterministic'
          PY
      - name: Merge shard reports
        shell: bash
        run: python tools/run_validation.py --merge-shards "$RUNNER_TEMP"/shards/**/shard-report.json --shard-count 5 --json "$RUNNER_TEMP/validation-report.json"
      - name: Validation report contract
        run: python tools/check_validation_report.py "$RUNNER_TEMP/validation-report.json"
      - name: Upload full-suite reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-py3.10
          path: |
            ${{ runner.temp }}/check-bundle-report.json
            ${{ runner.temp }}/validation-report.json
            ${{ runner.temp }}/shards/**/shard-report.json
          if-no-files-found: error

  validate-py314:
    name: suite (ubuntu, py3.14)
    if: ${{ always() }}
    needs: [suite-shards-py314]
    runs-on: ubuntu-latest
    steps:
      - name: Preserve published bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Require every py3.14 shard on main or manual runs
        if: ${{ github.event_name != 'pull_request' }}
        env:
          SHARDS_RESULT: ${{ needs.suite-shards-py314.result }}
        run: test "$SHARDS_RESULT" = success
      - name: Download py3.14 shard reports
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/download-artifact@v4
        with:
          pattern: validation-shard-py3.14-*
          merge-multiple: false
          path: ${{ runner.temp }}/shards
      - name: Install validation dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Bundle integrity
        run: python tools/check_bundle.py --root . --json "$RUNNER_TEMP/check-bundle-report.json"
      - name: Manifest is current and deterministic
        run: |
          python tools/build_validation_bundle.py --root . --check
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-a" --receipt "$RUNNER_TEMP/receipt-a.json"
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-b" --receipt "$RUNNER_TEMP/receipt-b.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          a = json.loads((tmp / 'receipt-a.json').read_text())
          b = json.loads((tmp / 'receipt-b.json').read_text())
          assert a['tree_sha256'] == b['tree_sha256'], 'export not deterministic'
          PY
      - name: Python 3.14 import, compile, and fixed smoke suite
        if: ${{ github.event_name == 'pull_request' }}
        run: python tools/quick_validation.py --json "$RUNNER_TEMP/quick-validation.json"
      - name: Merge shard reports
        if: ${{ github.event_name != 'pull_request' }}
        shell: bash
        run: python tools/run_validation.py --merge-shards "$RUNNER_TEMP"/shards/**/shard-report.json --shard-count 5 --json "$RUNNER_TEMP/validation-report.json"
      - name: Validation report contract
        if: ${{ github.event_name != 'pull_request' }}
        run: python tools/check_validation_report.py "$RUNNER_TEMP/validation-report.json"
      - name: Upload full-suite reports
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: validation-reports-py3.14
          path: |
            ${{ runner.temp }}/check-bundle-report.json
            ${{ runner.temp }}/validation-report.json
            ${{ runner.temp }}/shards/**/shard-report.json
          if-no-files-found: error

  suite-shards-py314:
    name: validation shard (py3.14, ${{ matrix.shard }}/5)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - name: Preserve published bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Bundle integrity
        run: python tools/check_bundle.py --root . --json "$RUNNER_TEMP/check-bundle-report.json"
      - name: Manifest is current and deterministic
        run: |
          python tools/build_validation_bundle.py --root . --check
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-a" --receipt "$RUNNER_TEMP/receipt-a.json"
          python tools/build_validation_bundle.py --root . --out "$RUNNER_TEMP/export-b" --receipt "$RUNNER_TEMP/receipt-b.json"
          python - <<'PY'
          import json, os
          from pathlib import Path
          tmp = Path(os.environ['RUNNER_TEMP'])
          a = json.loads((tmp / 'receipt-a.json').read_text())
          b = json.loads((tmp / 'receipt-b.json').read_text())
          assert a['tree_sha256'] == b['tree_sha256'], 'export not deterministic'
          PY
      - name: Validation shard
        run: python tools/run_validation.py --shard "${{ matrix.shard }}/5" --json "$RUNNER_TEMP/shard-report.json"
      - name: Upload shard report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-shard-py3.14-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/check-bundle-report.json
            ${{ runner.temp }}/shard-report.json
          if-no-files-found: error

  windows-structural:
    name: structural only (windows)
    runs-on: windows-latest
    steps:
      - name: Preserve published bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Bundle integrity (stdlib only)
        run: python tools/check_bundle.py --root .
      - name: Manifest determinism (stdlib only)
        run: python tools/build_validation_bundle.py --root . --check

  windows-publication:
    name: native publication (windows, py${{ matrix.python }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Preserve published bytes before checkout
        shell: bash
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install runtime dependencies
        run: python -m pip install -r requirements-validation.txt
      - name: Bundle integrity
        run: python tools/check_bundle.py --root . --json "$env:RUNNER_TEMP/native-bundle-report.json"
      - name: Manifest is current
        run: python tools/build_validation_bundle.py --root . --check
      - name: Native init apply publication replay cleanup (no skips)
        run: python tools/run_native_publication.py --json "$env:RUNNER_TEMP/native-publication-report.json"
      - name: Upload native publication reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-publication-py${{ matrix.python }}
          path: |
            ${{ runner.temp }}/native-bundle-report.json
            ${{ runner.temp }}/native-publication-report.json
          if-no-files-found: error

  notify-main-failure:
    name: notify on main validation failure
    if: ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (needs.validate-py310.result == 'failure' || needs.validate-py314.result == 'failure') }}
    needs: [validate-py310, validate-py314]
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Comment on existing validation issue or open one
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PY310_RESULT: ${{ needs.validate-py310.result }}
          PY314_RESULT: ${{ needs.validate-py314.result }}
        run: |
          set -euo pipefail
          body="Main validation failed (py3.10=${PY310_RESULT}, py3.14=${PY314_RESULT}): ${RUN_URL}"
          issue=$(gh issue list --repo "$REPOSITORY" --state open --search 'in:title "Main validation failed"' --json number --jq '.[0].number // empty')
          if [ -n "$issue" ]; then
            gh issue comment "$issue" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "Main validation failed" --body "$body"
          fi
